<!DOCTYPE html>
<html>
<head>
<meta name="fused-app">
<meta name="fused-api-version" content="1" />
<meta charset="utf-8" />
<title>sample app 4</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eaed;
    background: #131417;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  #controls label {
    color: #9aa0a6;
    font-size: 13px;
  }
  #freq {
    width: 260px;
  }
  #freqValue {
    font-variant-numeric: tabular-nums;
    min-width: 3em;
  }
  svg {
    border: 1px solid #2a2d33;
    border-radius: 8px;
    background: #1b1d21;
  }
</style>
</head>
<body>
  <h1>sample app 4</h1>
  <div id="controls">
    <label for="freq">freq</label>
    <input id="freq" type="range" min="0.1" max="5" step="0.1" value="1.0" />
    <span id="freqValue"></span>
  </div>
  <svg id="chart" width="640" height="280" viewBox="0 0 640 280"></svg>

  <script>
    const slider = document.getElementById("freq");
    const freqValueEl = document.getElementById("freqValue");
    const svg = document.getElementById("chart");

    const W = 640, H = 280, PAD = 20;
    let current = [];

    function currentFreq() {
      const raw = fused.params.get("freq");
      return raw !== undefined ? parseFloat(raw) : 1.0;
    }

    function pointsToPolyline(points) {
      // points: [[x in 0..1, y in -1..1], ...]
      return points
        .map(([x, y]) => {
          const px = PAD + x * (W - 2 * PAD);
          const py = H / 2 - y * (H / 2 - PAD);
          return `${px.toFixed(1)},${py.toFixed(1)}`;
        })
        .join(" ");
    }

    async function draw() {
      const freq = currentFreq();
      slider.value = String(freq);
      freqValueEl.textContent = freq.toFixed(1);

      const { points } = await fused.runPython("./sine.py", { n: "160", freq: String(freq) });

      const axis = `<line x1="${PAD}" y1="${H / 2}" x2="${W - PAD}" y2="${H / 2}" stroke="#3a3d44" />`;
      const line = `<polyline points="${pointsToPolyline(points)}" fill="none" stroke="#ef4444" stroke-width="2" />`;
      current = points;
      svg.innerHTML = axis + line + '<g id="hover" style="display:none"><line id="hv" y1="0" y2="280" stroke="#5f6368" stroke-dasharray="4 3" /><circle id="hd" r="5" fill="#ef4444" /><text id="ht" fill="#e8eaed" font-size="12"></text></g>';
    }

    svg.addEventListener("mousemove", (e) => {
      const g = svg.querySelector("#hover");
      if (!g || !current.length) return;
      const rect = svg.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const t = Math.min(1, Math.max(0, (mx - PAD) / (W - 2 * PAD)));
      const [x, y] = current[Math.round(t * (current.length - 1))];
      const px = PAD + x * (W - 2 * PAD);
      const py = H / 2 - y * (H / 2 - PAD);
      g.style.display = "";
      g.querySelector("#hv").setAttribute("x1", px);
      g.querySelector("#hv").setAttribute("x2", px);
      const d = g.querySelector("#hd");
      d.setAttribute("cx", px);
      d.setAttribute("cy", py);
      const label = g.querySelector("#ht");
      label.setAttribute("x", px > W - 110 ? px - 105 : px + 10);
      label.setAttribute("y", Math.min(Math.max(py - 10, 16), H - 8));
      label.textContent = `x=${x.toFixed(2)}  y=${y.toFixed(2)}`;
    });

    svg.addEventListener("mouseleave", () => {
      const g = svg.querySelector("#hover");
      if (g) g.style.display = "none";
    });

    slider.addEventListener("input", () => {
      fused.params.set("freq", slider.value);
    });
    fused.params.onChange(draw);
    draw();
  </script>
</body>
</html>
